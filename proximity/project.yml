name: FluniProx
options:
  bundleIdPrefix: com.fluni
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${FLUNI_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES

# Both apps use the radios, so they share these Info.plist keys. The Bonjour service is the same,
# so FlUni and harness phones see each other.
x-radio-info: &radioInfo
  UIUserInterfaceStyle: Light
  UILaunchScreen: {}
  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  NSBluetoothAlwaysUsageDescription: Detects nearby FlUni phones by Bluetooth to estimate distance.
  NSNearbyInteractionUsageDescription: Measures precise distance to nearby FlUni phones with ultra wideband.
  NSLocalNetworkUsageDescription: Links to nearby FlUni phones to exchange ranging tokens and status.
  NSLocationWhenInUseUsageDescription: Used as a fallback distance estimate to nearby FlUni phones.
  NSBonjourServices: [_fluni-prox._tcp, _fluni-prox._udp]
  NSAppTransportSecurity:
    NSAllowsLocalNetworking: true

targets:
  # The student app. Core/ = sensing and maths (no SwiftUI), SharedUI/ = views both apps use.
  FlUni:
    type: application
    platform: iOS
    sources: [Core, SharedUI, FlUni]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluni.app
        PRODUCT_NAME: FlUni
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlUni/Info.plist
      properties:
        <<: *radioInfo
        CFBundleDisplayName: FlUni
        NSLocationWhenInUseUsageDescription: Your precise location never leaves this phone and is never seen by anyone. FlUni only uses it on your phone to warn you about busy buildings.
        NSLocationAlwaysAndWhenInUseUsageDescription: Your precise location never leaves this phone and is never seen by anyone. FlUni only uses it on your phone to warn you about busy buildings.
        UIBackgroundModes: [location]

  # Test harness: same Core, developer view first, obeys test launch arguments. tools/ drive it.
  FluniProx:
    type: application
    platform: iOS
    sources: [Core, SharedUI, Harness]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluni.proxtest
    info:
      path: Harness/Info.plist
      properties:
        <<: *radioInfo
        CFBundleDisplayName: FluniProx

  FluniProxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FluniProx

  # XCUITest for the student app. Each test launches FlUni with FLUNI_UITEST_RESET=1 and FLUNI_UITEST_NO_RADIOS=1.
  FlUniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FlUni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluni.app.uitests
        TEST_TARGET_NAME: FlUni

schemes:
  FlUni:
    build:
      targets:
        FlUni: all
    test:
      targets: [FlUniUITests]
